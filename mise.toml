# SPDX-License-Identifier: MIT

[tools]
rust = { version = "stable", profile = "default", components = [
    "rust-analyzer",
    "rust-src",
    "llvm-tools",
] }
"aqua:rustsec/rustsec/cargo-audit" = "0.22.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.87"
"aqua:taiki-e/cargo-llvm-cov" = "0.6.16"
"github:EmbarkStudios/cargo-about" = "0.6.6"
"cargo:bacon" = "3.25.0"
"cargo:cargo-fuzz" = "0.13.1"
"cargo:cargo-toml-lint" = "0.1.1"
"cargo:cross" = "0.2.5"
"cargo:mdbook" = "0.5.4"
"cargo:mdbook-inline-highlighting" = "0.1.0"
"cargo:semantic-release-cargo" = "2.4.84"
"npm:conventional-changelog-conventionalcommits" = "10.4.0"
"npm:semantic-release" = "24.2.9"
"npm:semantic-release-export-data" = "1.2.0"
"npm:vercel" = "59.25.2"
node = "22.23.3"
uv = "0.12.17"
"github:xd009642/tarpaulin" = "0.37.4"
gitleaks = "8.30.1"
"npm:renovate" = { version = "latest", trust_policy_excludes = [
    "@yarnpkg/libzip@3.2.2",
] }

[tasks.coverage]
description = "Generate test coverage information"
run = [
    "cargo llvm-cov --no-report nextest --config-file nextest.toml",
    "cargo llvm-cov --no-report --doc",
    "cargo llvm-cov report --doctests --lcov --output-path lcov.info",
]

[settings]
experimental = true
lockfile = true
