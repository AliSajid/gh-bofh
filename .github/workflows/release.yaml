on:
  workflow_call:
name: Semantic Release
env:
  RUST_BACKTRACE: 1
  SEMREL_RUST_VERSION: 2.1.53
concurrency:
  group: ${{ github.workflow }}
jobs:
  build_application:
    name: Build CLI ${{ matrix.build.target }}
    runs-on: ${{ matrix.build.os }}
    env:
      CARGO: cargo
    strategy:
      matrix:
        bin:
          - gh-bofh
        build:
          # alphabatized by target
          - os: macOS-latest
            target: aarch64-apple-darwin
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            cross: true
          - os: macOS-latest
            target: x86_64-apple-darwin
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            cross: true
          - os: ubuntu-latest
            target: i686-pc-windows-gnu
            cross: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install tree
        if: runner.os == 'Linux'
        run: sudo apt install tree

      - name: Install build inputs
        if: runner.os == 'Linux' && !matrix.build.cross
        run: sudo apt install musl-tools mingw-w64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        id: rust-toolchain
        with:
          toolchain: stable
          target: ${{ matrix.build.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Install cross
        uses: taiki-e/install-action@132c875eef0d3e3be95c2d08d74e8559cbf74bdb # v2.62.55
        with:
          tool: cross

      - name: Configure cross
        if: matrix.build.cross
        run: echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Compile release binary
        run: ${{ env.CARGO }} build --bin ${{ matrix.bin }} --release --target ${{ matrix.build.target }} --verbose

      - name: Show generated binary
        if: runner.os == 'Linux'
        run: tree target/

      - name: Create release archive - windows
        if: matrix.build.target == 'x86_64-pc-windows-gnu' || matrix.build.target == 'i686-pc-windows-gnu'
        run: |
          mkdir dist
          cp target/${{ matrix.build.target }}/release/${{ matrix.bin }}.exe dist/${{ matrix.bin }}-${{ matrix.build.target }}

      - name: Create release archive - non-windows
        if: matrix.build.target != 'x86_64-pc-windows-gnu' && matrix.build.target != 'i686-pc-windows-gnu'
        run: |
          mkdir dist
          cp target/${{ matrix.build.target }}/release/${{ matrix.bin }} dist/${{ matrix.bin }}-${{ matrix.build.target }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.build.target }}
          path: |
            dist/${{ matrix.bin }}-${{ matrix.build.target }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: build_application
    permissions:
      id-token: write
      attestations: write
    outputs:
      new_release_version: ${{steps.semantic.outputs.new_release_version}}
      new_release_published: ${{steps.semantic.outputs.new_release_published}}
      new_release_notes: ${{steps.semantic.outputs.new_release_notes}}
      new_release_channel: ${{steps.semantic.outputs.new_release_channel}}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_SUBKEY_FINGERPRINT }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_committer_name: ${{ vars.GIT_AUTHOR_NAME }}
          git_committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}

      - name: Test GPG Key Import
        run: gpg --list-keys --keyid-format LONG

      - name: Install dependencies
        run: sudo apt install tree

      - name: Install semantic-release-cargo
        uses: taiki-e/install-action@132c875eef0d3e3be95c2d08d74e8559cbf74bdb # v2.62.55
        with:
          tool: semantic-release-cargo@${{env.SEMREL_RUST_VERSION}}

      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: ls artifacts
        run: tree ./artifacts

      - name: Prepare GitHub Release artifacts
        run: ./scripts/build.sh

      - name: Attest build provenance
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/gh-bofh*
            !dist/*.asc

      - name: Move attestation to dist
        run: mv ${{steps.attestation.outputs.bundle-path}} dist/attestation.jsonl

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ba330626c4750c19d8299de843f05c7aa5574f62 # v5.0.2
        id: semantic
        with:
          semantic_version: 24.0.0
          extra_plugins: |
            @semantic-release/exec@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{secrets.ACTIONS_PAT_GITHUB}}
          CARGO_REGISTRY_TOKEN: ${{secrets.SEMREL_CRATES_IO}}
          GIT_AUTHOR_NAME: ${{vars.GIT_AUTHOR_NAME}}
          GIT_AUTHOR_EMAIL: ${{vars.GIT_AUTHOR_EMAIL}}
          GIT_COMMITTER_NAME: ${{vars.GIT_AUTHOR_NAME}}
          GIT_COMMITTER_EMAIL: ${{vars.GIT_AUTHOR_EMAIL}}
